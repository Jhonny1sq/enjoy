<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retro Emulator</title>
  <style>
    :root { --bg:#0a0c10; --surface:#151a22; --line:#232a36; --text:#e6ecf5; --muted:#8b97a8; --accent:#5eead4; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(900px 500px at 50% -10%,#121a24,transparent 60%),var(--bg); color:var(--text); font:14px ui-monospace,Consolas,monospace; }
    header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(10,12,16,.9); backdrop-filter:blur(10px); }
    a { color:inherit; text-decoration:none; } .back { color:var(--accent); } .title { font-weight:700; letter-spacing:.1em; text-transform:uppercase; } .spacer { flex:1; }
    input { width:min(320px,42vw); padding:9px 11px; background:#11151b; border:1px solid var(--line); border-radius:7px; color:var(--text); font:inherit; outline:none; }
    input:focus { border-color:var(--accent); }
    main { max-width:1100px; margin:auto; padding:28px 20px 44px; } p { color:var(--muted); } .actions { display:flex; gap:10px; margin:20px 0; }
    .button { padding:9px 12px; border:1px solid #2dd4bf; border-radius:7px; color:var(--accent); background:#11151b; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px; }
    .game { padding:16px; border:1px solid var(--line); border-radius:10px; background:var(--surface); transition:transform .12s,border-color .12s; }
    .game:hover { transform:translateY(-2px); border-color:#3a4a63; } .system { display:block; margin-top:7px; color:var(--accent); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
    .empty { color:var(--muted); padding:30px 0; }
  </style>
</head>
<body>
  <header><a class="back" href="../../index.html">← arcade</a><span class="title">retro emulator</span><span class="spacer"></span><input id="search" type="search" placeholder="search ROMs" autofocus></header>
  <main>
    <p>Choose an included game, or open the emulator to load your own compatible ROM.</p>
    <div class="actions"><a class="button" href="index.html">Open your own ROM</a></div>
    <section id="grid" class="grid" aria-label="retro games"></section>
    <p id="empty" class="empty" hidden>No matching ROMs.</p>
  </main>
  <script>
    const games = [
      ['Tetris','NES','Tetris (U) .nes'],
      ['Mortal Kombat II','PlayStation','Mortal Kombat II (Japan).chd'],
      ['Pokémon Emerald','Game Boy Advance','Pokemon - Emerald Version (USA, Europe).gba'],
      ['Mortal Kombat','SNES','Mortal Kombat (USA).sfc'],
      ['Street Fighter II Turbo','SNES','Street Fighter II Turbo (V1.0) (E) [!].smc'],
      ['Pokémon Emerald Rogue','Game Boy Advance','Pokemon - Emerald Version (U) (patched) (1).gba'],
      ['Pokémon Fire Red','Game Boy Advance','Pokemon - Fire Red Version (U) (V1.1) (patched).gba']
    ];
    const grid = document.getElementById('grid'); const empty = document.getElementById('empty');
    function render(query = '') {
      const selected = games.filter(game => game.join(' ').toLowerCase().includes(query.toLowerCase()));
      grid.replaceChildren(...selected.map(([name, system, file]) => {
        const link = document.createElement('a'); link.className = 'game'; link.href = `em.html#${encodeURIComponent(file)}`;
        link.innerHTML = `<strong>${name}</strong><span class="system">${system}</span>`; return link;
      }));
      empty.hidden = selected.length !== 0;
    }
    document.getElementById('search').addEventListener('input', event => render(event.target.value)); render();
  </script>
</body>
</html>
