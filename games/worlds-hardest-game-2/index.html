    <style type="text/css">
      html, body {
        margin: 0;
        padding: 0;
        border: 0;
        overflow: hidden;
        background: black;
        width: 100%;
        height: 100%;
      }

      canvas {
        display: block !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        object-fit: contain;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: black;
      }

      .no-select {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
    </style>

    <script type="text/javascript">
      setTimeout(function () {
        if (document.getElementsByTagName("canvas").length) {
          document.getElementsByTagName("body")[0].classList.add("no-select");
        }
      }, 2000);
    </script>

    <script type="text/javascript">
      (function () {
        'use strict';

        function set(obj, name, value) {
          try {
            Object.defineProperty(obj, name, {
              value: value,
              configurable: true,
              writable: true
            });
          } catch (e) { /* locked prop, skip */ }
        }

        function fixPoint(t) {
          var c = document.querySelector('canvas');
          if (!c) return;
          var r = c.getBoundingClientRect();
          if (!c.width || !r.width) return;
          if (Math.abs(r.width - c.width) < 1 && Math.abs(r.height - c.height) < 1) return;

          var sx = c.width / r.width;
          var sy = c.height / r.height;

          var ox = (t.clientX - r.left) * sx;
          var oy = (t.clientY - r.top) * sy;
          var cx = ox + r.left;
          var cy = oy + r.top;

          set(t, 'offsetX', ox);
          set(t, 'offsetY', oy);
          set(t, 'clientX', cx);
          set(t, 'clientY', cy);
          set(t, 'pageX', cx + window.pageXOffset);
          set(t, 'pageY', cy + window.pageYOffset);
          set(t, 'x', cx);
          set(t, 'y', cy);
        }

        function remap(evt) {
          if (evt.touches) {
            for (var i = 0; i < evt.touches.length; i++) fixPoint(evt.touches[i]);
            if (evt.changedTouches) {
              for (var j = 0; j < evt.changedTouches.length; j++) fixPoint(evt.changedTouches[j]);
            }
          } else {
            fixPoint(evt);
          }
        }

        var events = [
          'mousedown', 'mouseup', 'click', 'mousemove', 'dblclick', 'contextmenu',
          'touchstart', 'touchend', 'touchmove', 'touchcancel'
        ];
        for (var k = 0; k < events.length; k++) {
          document.addEventListener(events[k], remap, true);
        }
      })();
    </script>

  <body>
    <div>

    <script>
      function fnSendMsg(evt) {
        window.parent.postMessage("keypress-from-game", "*");
      }
      document.body.addEventListener("click", fnSendMsg);
      document.addEventListener("keypress", fnSendMsg);
      document.addEventListener("keydown", fnSendMsg);
      document.addEventListener("keyup", fnSendMsg);
    </script>
